{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>


<style>
    body
    {
        background-image: url('{% static 'images/dashboard2.gif'%}');
        background-size:100%;
    }

    .tabtheme
    {
        text-align: center;
        font-family: Arial;
        color: black;
        margin-top: 20px;
        margin-right: 180px;
        font-size: 25px;

        position: relative;
        animation: bankease 1s;

    }

    @keyframes bankease
        {
            from{top:-100px;}
            to{top:0px;}
        }


    a
    {
        color: black;
        text-decoration: none;
    }

    a:hover{
        color: #254104;
        text-decoration: underline;
    }


    .outerdiv
    {

        width: 53%;
        height: 100px;
        background-color: rgb(255,255,255,0.7);
        margin-left: 65px;
        position: relative;
        top: 200px;
        border-radius: 25px;
        border: double;
        border-color: white;
        color: white;
        background-color:rgba(0,0,0,0.5);

        transition: 0.3s;

    }

    .outerdiv:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }


    .slogan
    {
        font-size: 40px;
        position: relative;
        top: -25px;
    }


    .box{
        color: #18312e;
        border-radius:40px;
        transition:transform  .5s;
    }
    .box:hover
    {
        color: #18312e;
        transform:scale(1.3);
    }

    .option
    {
        color: white;
        margin-top: 480px;
        margin-left: 1150px;
        font-size: 25px;
    }





    .logintheme
    {
        background-color: #000000;
        color: #041786;
	    font-size:20px;
        width: 150px;
        height: 35px;
        border-radius: 15px;

        transition:transform  .5s;

        {#clip-path: polygon(#}
        {#8% 0%,#}
        {#92% 0%,#}
        {#100% 50%,#}
        {#92% 100%,#}
        {#8% 100%,#}
        {#0% 50%#}
        {#);#}

    }


    .logintheme:hover
    {
        transform:scale(1.3);
	    background-color: #202021;
        color:black;
    }




</style>

<body>

<table width="90%" class="tabtheme" align="right">

    <tr>

        <td class="box"><a href="custdashboardlink">Dashboard</a></td>
        <td class="box"><a href="orderlink">Order</a></td>
        <td class="box"><a href="settinglink">Settings</a></td>
        <td class="box"><a href="complainlink">Complain</a></td>
        <td class="box"><a href="feedbacklink">Feedback</a></td>
        <td class="box"><a href="deletelink">Account</a></td>


    </tr>

</table>





<div class="outerdiv">

    <h1 class="slogan">From Doorstep to Dashboard, Seamless Power</h1>


</div>



<div class="option">
    <table cellspacing="10px" cellpadding="10px" style="margin-left: 165px;margin-top: -5px">
        <tr align="center">


            <td class="logintheme" align="center"><a href="homelink" style="text-decoration: none;color: #04caf5">Log Out</a></td>
        </tr>
    </table>
</div>



</body>
</html>
