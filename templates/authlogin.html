{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>


<style>
    body
    {
        background-image: url('{% static 'images/auth (1).gif'%}');
        background-size:100%;
    }

    .tabtheme
    {
        text-align: center;
        font-family: Arial;
        color: white;
        margin-top: 20px;
        margin-right: 180px;
        font-size: 25px;

        position: relative;
        animation: bankease 1s;

    }

    @keyframes bankease
        {
            from{top:-100px;}
            to{top:0px;}
        }


    a
    {
        color: white;
        text-decoration: none;
    }

    a:hover{
        color: #0c7290;
        text-decoration: underline;
    }


    .outerdiv
    {

        width: 43%;
        height: 80px;
        background-color: rgb(255,255,255,0.7);
        margin-left: 425px;
        position: relative;
        top: 100px;
        border-radius: 25px;
        border: double;
        border-color: white;
        color: white;
        background-color:rgba(0,0,0,0.2);

        transition: 0.3s;

    }

    .outerdiv:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.6);
    }


    .slogan
    {
        font-size: 40px;
        position: relative;
        left: 25px;
        top: -38px;
    }


    .box
    {
        color: #18312e;
        border-radius:40px;
        transition:transform  .5s;
    }
    .box:hover
    {
        color: #18312e;
        transform:scale(1.3);
    }

    .formtheme
    {
        background-color:rgba(0,0,0,0.3);
        margin-top: 300px;
        margin-left: 560px;
        border: solid;
        width: 400px;
        height: 275px;
        border-radius: 15px;
        transition: 0.3s;
    }

    .formtheme:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    .texttheme
    {
        width: 200%;
        height: 25px;
        border-radius: 5px;
    }

    .buttontheme
    {
        width: 150%;
        margin-left: 50px;
        border-radius: 5px;
        margin-top: 10px;
        transition: 0.3s;
        background-color: #e7e8fd;
    }

    .buttontheme:hover
    {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    .newuser
    {

        position: relative;
        left: 110px;

    }







</style>

<body>



                                                    {#Login Table#}

<div class="formtheme">

    <form action="al" method="post">

    {% csrf_token %}


<table width="200px" cellspacing="15px" style="color: white">

    <tr>
        <td>ID</td>
    </tr>

    <tr>
        <td><input type="text" name="aid" placeholder="Enter ID here" required="true" class="texttheme"></td>
    </tr>

    <tr>
        <td>Password</td>
    </tr>

    <tr>
        <td><input type="password" name="password" placeholder="Enter Password here" required="true" class="texttheme"></td>
    </tr>

    <tr>
        <td><input type="submit" value="Log In" class="buttontheme"></td>
    </tr>

    <tr align="center" style="color: red;margin-left: 100px">
        <td>{{ error_msg }}</td>
    </tr>


</table>


        </form>

</div>






</body>
</html>
