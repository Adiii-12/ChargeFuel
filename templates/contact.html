{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>


<style>
    body
    {
        background-image: url('{% static 'images/contact3.png'%}');
        background-size:100%;
    }

    .tabtheme
    {
        text-align: center;
        font-family: Arial;
        color: white;
        margin-top: 20px;
        margin-right: 180px;
        font-size: 25px;

        position: relative;
        animation: bankease 1s;

    }

    @keyframes bankease
        {
            from{top:-100px;}
            to{top:0px;}
        }


    a
    {
        color: white;
        text-decoration: none;
    }

    a:hover{
        color: #0c7290;
        text-decoration: underline;
    }


    .outerdiv
    {

        width: 48%;
        height: 80px;
        background-color: rgb(255,255,255,0.7);
        margin-left: 410px;
        position: relative;
        top: 100px;
        border-radius: 25px;
        border: double;
        border-color: white;
        color: white;
        background-color:rgba(0,0,0,0.2);

        transition: 0.3s;

    }

    .outerdiv:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.6);
    }


    .slogan
    {
        font-size: 40px;
        position: relative;
        left: 25px;
        top: -38px;
    }


    .box{
        color: #18312e;
        border-radius:40px;
        transition:transform  .5s;
    }
    .box:hover
    {
        color: #18312e;
        transform:scale(1.3);
    }

    .formtheme
    {
        background-color:rgba(0,0,0,0.3);
        margin-top: 140px;
        margin-left: 180px;
        border: solid;
        border-color: white;
        width: 470px;
        height: 405px;
        border-radius: 15px;
        transition: 0.3s;
    }

    .formtheme:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.6);
    }

    .texttheme
    {
        width: 200%;
        height: 20px;
    }

    .buttontheme
    {
        width: 150%;
        margin-left: 50px;
        border-radius: 5px;
        margin-top: 10px;
        transition: 0.3s;
        background-color: #e7e8fd;
    }

    .buttontheme:hover
    {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.5);
    }

    .newuser
    {

        position: relative;
        left: 110px;

    }







</style>

<body>

<table width="90%" class="tabtheme" align="right">

    <tr>

        <td class="box"><a href="homelink">Home</a></td>
        <td class="box"><a href="aboutlink">About Us</a></td>
        <td class="box"><a href="servicelink">Services</a></td>
        <td class="box"><a href="contactlink">Contact Us</a></td>

    </tr>

</table>





<div class="outerdiv">

    <h1 class="slogan">Connecting you to solutions that matter</h1>

</div>


                                                    {#Contact Table#}

<div class="formtheme">

        <form action="contactcodedb" method="post">

        {% csrf_token %}


<table width="230px" cellspacing="18px" style="color: white">

    <tr>
        <td>Name</td>
    </tr>

    <tr>
        <td><input type="text" name="fnm" placeholder="Enter Full Name here" required="true" class="texttheme"></td>
    </tr>

    <tr>
        <td>City</td>
    </tr>

    <tr>
        <td><select name="city" required="true" class="texttheme">
            <option>Select City</option>
            <option>Indore</option>
            <option>Ujjain</option>
            <option>Dewas</option>
        </select> </td>
    </tr>

    <tr>
        <td>Contact</td>
    </tr>

    <tr>
        <td><input type="number" name="contact" placeholder="Enter Contact Number here" required="true" class="texttheme"></td>
    </tr>

    <tr>
        <td>Query</td>
    </tr>

    <tr>
        <td><textarea name="query" placeholder="Enter Query here" required="true" class="texttheme"></textarea> </td>
    </tr>


    <tr>
        <td><input type="submit" value="Send" class="buttontheme"></td>
    </tr>



</table>
        </form>

</div>






</body>
</html>
