{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>


<style>
    body
    {
        background-image: url('{% static 'images/complain.png'%}');
        background-size:100%;
    }

    .tabtheme
    {
        text-align: center;
        font-family: Arial;
        color: black;
        margin-top: 20px;
        margin-right: 180px;
        font-size: 25px;

        position: relative;
        animation: bankease 1s;

    }

    @keyframes bankease
        {
            from{top:-100px;}
            to{top:0px;}
        }


    a
    {
        color: black;
        text-decoration: none;
    }

    a:hover{
        color: #254104;
        text-decoration: underline;
    }


    .outerdiv
    {

        width: 34%;
        height: 80px;
        background-color: rgb(255,255,255,0.7);
        margin-left: 500px;
        position: relative;
        top: 100px;
        border-radius: 25px;
        border: double;
        border-color: white;
        color: white;
        background-color:rgba(0,0,0,0.5);

        transition: 0.3s;

    }

    .outerdiv:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }


    .slogan
    {
        font-size: 40px;
        position: relative;
        top: -35px;
        left: 10px;
    }


    .box{
        color: #18312e;
        border-radius:40px;
        transition:transform  .5s;
    }
    .box:hover
    {
        color: #18312e;
        transform:scale(1.3);
    }

    .formtheme
    {
        background-color:rgba(0,0,0,0.6);
        margin-top: 240px;
        margin-left: 200px;
        border: solid;
        width: 400px;
        height: 280px;
        border-radius: 15px;
        transition: 0.3s;
    }

    .formtheme:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    .texttheme
    {
        width: 550%;
        height: 25px;
        border-radius: 5px;
    }

    .buttontheme
    {
        width: 200%;
        margin-left: 50px;
        border-radius: 5px;
        margin-top: 0px;
        position: relative;
        left:30px;
        top: 10px;
        transition: 0.3s;
        background-color: #e7e8fd;
    }

    .buttontheme:hover
    {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }




</style>

<body>

<table width="90%" class="tabtheme" align="right">

    <tr>

        <td class="box"><a href="custdashboardlink">Dashboard</a></td>
        <td class="box"><a href="orderlink">Order</a></td>
        <td class="box"><a href="settinglink">Settings</a></td>
        <td class="box"><a href="complainlink">Complain</a></td>
        <td class="box"><a href="feedbacklink">Feedback</a></td>
        <td class="box"><a href="deletelink">Account</a></td>


    </tr>

</table>


<div class="outerdiv">

    <h1 class="slogan">Speak up-we’re here to listen</h1>


</div>

{#                                COMPLAIN TABLE#}



<div class="formtheme">

    <form action="comp" method="post">

    {% csrf_token %}


<table width="200px" cellspacing="20px" style="color: white">


    <tr>
        <td>ID</td>
        <td><input type="text" name="uid" placeholder="Enter ID here" required="true" class="texttheme"></td>

    </tr>


    <tr>
        <td>Complain</td>
        <td><textarea name="complain" placeholder="Enter Complain here" required="true" class="texttheme" style="height: 40px"></textarea></td>

    </tr>

    <tr>
        <td>Order ID</td>
        <td><input type="number" name="orderid" placeholder="Enter Order ID here" required="true" class="texttheme" style="height: 40px"></td>

    </tr>



    <tr>
        <td><input type="submit" value="Send" class="buttontheme"></td>
    </tr>




    </table>


        </form>

</div>



</body>
</html>
