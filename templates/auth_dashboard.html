{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>


<style>
    body
    {
        background-image: url('{% static 'images/auth_dash2.png'%}');
        background-size:100%;
    }

    .tabtheme
    {
        text-align: center;
        font-family: Arial;
        color: white;
        margin-top: 20px;
        margin-right: 180px;
        font-size: 25px;

        position: relative;
        animation: bankease 1s;

    }

    @keyframes bankease
        {
            from{top:-100px;}
            to{top:0px;}
        }


    a
    {
        color: white;
        text-decoration: none;
    }

    a:hover{
        color: #34bfea;
        text-decoration: underline;
    }


    .outerdiv
    {

        width: 30%;
        height: 100px;
        background-color: rgb(255,255,255,0.7);
        margin-left: 150px;
        position: relative;
        top: 200px;
        border-radius: 25px;
        border: double;
        border-color: white;
        color: white;
        background-color:rgba(0,0,0,0.5);

        transition: 0.3s;

    }

    .outerdiv:hover
    {
        transform: translateY(-8px);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
    }


    .slogan
    {
        font-size: 40px;
        position: relative;
        top: -25px;
        left: 85px;
    }


    .box{
        color: #18312e;
        border-radius:40px;
        transition:transform  .5s;
    }
    .box:hover
    {
        color: #18312e;
        transform:scale(1.3);
    }

    .option
    {
        color: white;
        margin-top: 480px;
        margin-left: 1150px;
        font-size: 25px;
    }





    .logintheme
    {
        background-color: #000000;
        color: #041786;
	    font-size:20px;
        width: 150px;
        height: 35px;
        border-radius: 15px;

        transition:transform  .5s;

        clip-path: polygon(
        8% 0%,
        92% 0%,
        100% 50%,
        92% 100%,
        8% 100%,
        0% 50%
        );

    }


    .logintheme:hover
    {
        transform:scale(1.3);
	    background-color: #202021;
        color:black;
    }



    .service-wrapper
{
    width: 80%;
    display: flex;
    justify-content: flex-start;
    padding-left: 120px;
    margin-top: -225px;
}

.service-section
{
    display: flex;
    gap: 60px;
}

.service-card
{
    width: 200px;
    height: 200px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 40px;
    text-align: center;
    color: white;
    backdrop-filter: blur(10px);
    transition: 0.4s ease;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    position: relative;
    right: 75px;
}

.service-card:hover
{
    transform: translateY(-9px);
    box-shadow: 0 15px 40px rgb(149, 231, 245);
    {#box-shadow: 0 15px 40px rgba(255, 255, 255,0.5);#}
}

.service-card i
{
    font-size: 50px;
    margin-top: 45px;
    display: block;
}

.service-title
{
    margin-top: 15px;
    font-size: 20px;
    font-weight: 500;
}




</style>

<body>

<table width="90%" class="tabtheme" align="right">

    <tr>

        <td class="box"><a href="authlink">Dashboard</a></td>
        <td class="box"><a href="load_account">Accounts</a></td>
        <td class="box"><a href="load_order">Orders</a></td>
        <td class="box"><a href="authsettingink">Settings</a></td>
        <td class="box"><a href="load_complain">Complains</a></td>
        <td class="box"><a href="load_feedback">Feedbacks</a></td>


    </tr>

</table>





<div class="outerdiv">

    <h1 class="slogan">Welcome Sir !!!</h1>


</div>



<div class="option">
    <table cellspacing="10px" cellpadding="10px" style="margin-left: 165px;margin-top: -5px">
        <tr align="center">


            <td class="logintheme" align="center"><a href="homelink" style="text-decoration: none;color: #04caf5">Log Out</a></td>
        </tr>
    </table>
</div>





<div class="service-wrapper">

    <div class="service-section">

        <div class="service-card">
            <i>🧾</i>
            <div class="service-title">All Accounts</div>
        </div>

        <div class="service-card">
            <i>🥳</i>
            <div class="service-title">All Orders</div>
        </div>

        <div class="service-card">
            <i>🥶</i>
            <div class="service-title">All Complains & Feedbacks</div>
        </div>

    </div>

</div>



</body>
</html>
